<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/output.css" />
    <link rel="icon" href="/assets/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"

    />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />
    <title>Typical</title>

  <body>
    <main>
      <div class="relative mx-auto w-full grow" style="pointer-events: auto">
        <!-- Heading -->
        <div class="relative w-full max-w-full overflow-hidden py-16">
          <div class="mx-auto max-w-2xl">
            <div class="flex justify-center mb-12">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="currentColor"
                height="50"
                width="50"
                viewBox="0 0 269.59 300"
              >
                <path
                  d="M214.88,43.19V9.35c0-5.9-5.39-10.32-11.17-9.16L7.51,39.42c-4.37.87-7.51,4.71-7.51,9.16v196.38c0,5.9,5.39,10.32,11.17,9.16l32.36-6.47c5.78-1.16,11.17,3.27,11.17,9.16v33.84c0,5.9,5.39,10.32,11.17,9.16l196.19-39.24c4.37-.87,7.51-4.71,7.51-9.16V55.04c0-5.9-5.39-10.32-11.17-9.16l-32.36,6.47c-5.78,1.16-11.17-3.27-11.17-9.16ZM28.03,210.77V71.56c0-4.45,3.14-8.29,7.51-9.16l140.14-28.03c5.78-1.16,11.17,3.27,11.17,9.16v9c0,4.45-3.14,8.29-7.51,9.16l-117.12,23.42c-4.37.87-7.51,4.71-7.51,9.16v114.9c0,4.45-3.14,8.29-7.51,9.16l-8,1.6c-5.78,1.16-11.17-3.27-11.17-9.16ZM186.85,100.17v82.58c0,4.45-3.14,8.29-7.51,9.16l-85.43,17.09c-5.78,1.16-11.17-3.27-11.17-9.16v-82.58c0-4.45,3.14-8.29,7.51-9.16l85.43-17.09c5.78-1.16,11.17,3.27,11.17,9.16ZM234.05,237.6l-140.14,28.03c-5.78,1.16-11.17-3.27-11.17-9.16v-9c0-4.45,3.14-8.29,7.51-9.16l117.12-23.42c4.37-.87,7.51-4.71,7.51-9.16v-114.9c0-4.45,3.14-8.29,7.51-9.16l8-1.6c5.78-1.16,11.17,3.27,11.17,9.16v139.21c0,4.45-3.14,8.29-7.51,9.16Z"
                ></path>
              </svg>
            </div>
            <h1
              class="relative px-4 text-center text-5xl font-semibold leading-[0.9] tracking-tight lg:leading-none"
            >
              Typical helps you detect and profile fonts on any website
            </h1>
          </div>
        </div>

        <!-- Extension links -->
        <div class="px-4 pb-16" style="pointer-events: auto">
          <div
            class="bg-gray-100 mx-auto space-y-10 rounded-lg text-black md:max-w-screen-sm border-2 border-black px-4 py-6 md:px-16 md:py-10"
            style="pointer-events: auto"
          >
            <div class="space-y-2">
              <h2 class="text-2xl font-semibold md:text-3xl">
                Get the extension
              </h2>
              <div>
                <!-- Chromium -->
                <div class="group">
                  <a
                    class="flex items-center justify-between pt-4"
                    target="_blank"
                    rel="noopener noreferrer"
                    href="https://chromewebstore.google.com/detail/#"
                    ><div class="flex flex-1 items-center space-x-4">
                      <div>
                        <img
                          alt=""
                          loading="lazy"
                          width="113"
                          height="31"
                          decoding="async"
                          style="color: transparent"
                          src="/assets/images/chromium.png"
                        />
                      </div>
                      <div class="text-lg font-bold leading-tight md:text-xl">
                        Chrome, Brave, Edge
                      </div>
                    </div>
                    <div class="transition-transform group-hover:translate-x-2">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                        aria-hidden="true"
                        data-slot="icon"
                        height="32"
                        class="h-7 md:h-8"
                      >
                        <path
                          fill-rule="evenodd"
                          d="M12.97 3.97a.75.75 0 0 1 1.06 0l7.5 7.5a.75.75 0 0 1 0 1.06l-7.5 7.5a.75.75 0 1 1-1.06-1.06l6.22-6.22H3a.75.75 0 0 1 0-1.5h16.19l-6.22-6.22a.75.75 0 0 1 0-1.06Z"
                          clip-rule="evenodd"
                        ></path>
                      </svg></div
                  ></a>
                </div>
                <!-- Safari -->
                <div
                  class="group border-b-2 border-b-black opacity-50 cursor-not-allowed hidden"
                >
                  <a
                    aria-disabled="true"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="flex items-center justify-between py-4 pointer-events-none"
                    href="#"
                    ><div class="flex flex-1 items-center space-x-4">
                      <div>
                        <img
                          alt=""
                          loading="lazy"
                          width="30"
                          height="30"
                          decoding="async"
                          style="color: transparent"
                          src="/assets/images/safari.webp"
                        />
                      </div>
                      <div class="text-lg font-bold leading-tight md:text-xl">
                        Safari
                      </div>
                    </div>
                    <div class="transition-transform group-hover:translate-x-2">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                        aria-hidden="true"
                        data-slot="icon"
                        height="32"
                        class="h-7 md:h-8"
                      >
                        <path
                          fill-rule="evenodd"
                          d="M12.97 3.97a.75.75 0 0 1 1.06 0l7.5 7.5a.75.75 0 0 1 0 1.06l-7.5 7.5a.75.75 0 1 1-1.06-1.06l6.22-6.22H3a.75.75 0 0 1 0-1.5h16.19l-6.22-6.22a.75.75 0 0 1 0-1.06Z"
                          clip-rule="evenodd"
                        ></path>
                      </svg></div
                  ></a>
                </div>
                <!-- Firefox -->
                <div class="group opacity-50 cursor-not-allowed hidden">
                  <a
                    aria-disabled="true"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="flex items-center justify-between py-4 pointer-events-none"
                    href="#"
                    ><div class="flex flex-1 items-center space-x-4">
                      <div>
                        <img
                          alt=""
                          loading="lazy"
                          width="30"
                          height="30"
                          decoding="async"
                          style="color: transparent"
                          src="/assets/images/firefox.webp"
                        />
                      </div>
                      <div class="text-lg font-bold leading-tight md:text-xl">
                        Firefox
                      </div>
                    </div>
                    <div class="transition-transform group-hover:translate-x-2">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                        aria-hidden="true"
                        data-slot="icon"
                        height="32"
                        class="h-7 md:h-8"
                      >
                        <path
                          fill-rule="evenodd"
                          d="M12.97 3.97a.75.75 0 0 1 1.06 0l7.5 7.5a.75.75 0 0 1 0 1.06l-7.5 7.5a.75.75 0 1 1-1.06-1.06l6.22-6.22H3a.75.75 0 0 1 0-1.5h16.19l-6.22-6.22a.75.75 0 0 1 0-1.06Z"
                          clip-rule="evenodd"
                        ></path>
                      </svg></div
                  ></a>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Credit -->
        <footer class="flex justify-center text-sm font-medium">
          <div class="flex gap-2">
            <div>
              Follow
              <a
                href="https://x.com/typicalHQ"
                target="_blank"
                class="text-gray-500 hover:text-gray-600"
                >@typicalHQ</a
              >
            </div>
            <span>·</span>
            <div>
              By
              <a
                href="https://ebuka.ezeh.me"
                target="_blank"
                class="text-gray-500 hover:text-gray-600"
                >Ebuka Ezeh</a
              >
            </div>
          </div>
        </footer>
      </div>
    </main>
  </body>
</html>
